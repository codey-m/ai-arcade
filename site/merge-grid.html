  <style>

  color-scheme: light;
  --ink: #0c0c0d;
  --ink-2: #40464c;
  --body: #212326;
  --muted: #626a73;
  --line: #dde1e6;
  --rule: #e6e9ee;
  --ground: #f3f4f8;
  --red: #750014;
  --button-line: #b8c2cc;
  --gold-wash: #fbf0dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--body); font: 16px/1.55 "neue-haas-grotesk-text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
a { color: var(--red); text-underline-offset: 3px; }
button, summary { font: inherit; cursor: pointer; }

button.secondary { background: #fff; color: var(--ink-2); }
button:focus-visible, summary:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #1472ae; outline-offset: 3px; }
button[aria-pressed="true"] { color: var(--ink); background: var(--gold-wash); border-color: #815a25; }
[hidden] { display: none !important; }
.gamebar { background: #fff; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--rule); }
.gamebar a { display: grid; place-items: center; width: 44px; height: 44px; font-size: 24px; text-decoration: none; }
.gamebar h1 { margin: 0; text-align: center; font-size: clamp(26px, 3vw, 38px); letter-spacing: -.02em; }
main { max-width: 664px; margin: auto; padding: 12px; }
p, h2 { margin: 0 0 .6em; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.explainer { margin-top: 14px; padding: 10px 14px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.explainer summary { padding-block: 6px; font-weight: 600; }
.explainer p { margin: 6px 0 0; }
body:not([data-mode="course"]) .course-only,
body[data-mode="course"] .arcade-only,
body[data-mode="course"] .gamebar,
body.embedded .gamebar { display: none; }
#transfer { margin-top: 10px; }
#transfer h2 { font-size: 1rem; }
@media (max-width: 320px) {
  body[data-mode="course"] main,
  body[data-mode="course"] .puzzle { padding: 8px; }
  body[data-mode="course"] .gap { min-width: 16px; flex-basis: 16px; }
}
</style>
  <style>
.puzzle { max-width: 640px; margin: auto; padding: clamp(12px, 3vw, 26px); background: #fff; color: var(--body); border: 1px solid var(--line); border-radius: 6px; }
.score { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-block: 16px 12px; font-weight: 650; }
.score span + span { padding-left: 12px; border-left: 1px solid #a391a8; }
.board { display: grid; gap: 12px; border-radius: 8px; padding: clamp(7px, 2vw, 18px); background: #f9fafb; color: var(--body); border: 1px solid var(--line); }
.tile-row { display: flex; align-items: center; gap: 1px; }
.piece { display: inline-grid; place-items: center; min-width: 24px; min-height: 39px; padding-inline: 3px; border: 1px solid var(--button-line); border-radius: 5px; background: #fff; font: 700 1.06rem ui-monospace, monospace; }
.piece + .piece { margin-left: 4px; }
.piece.joined { background: var(--gold-wash); border-color: #815a25; }
.piece.fresh { animation: snap .2s ease-out; }
.gap { display: grid; place-items: center; flex: 0 0 23px; min-width: 23px; min-height: 44px; padding: 0; border: 1px solid transparent; background: transparent; color: var(--red); }
.gap:is(:hover,:focus-visible) { color: white; background: var(--red); }
#message { min-height: 24px; margin: 12px 0 8px; }
button:disabled { cursor: default; opacity: .6; }
@keyframes snap { 50% { transform: scale(1.13); } }
@media (max-width: 370px) {
  .board { padding-inline: 4px; }
  .piece { min-width: 20px; padding-inline: 2px; }
  .gap { min-width: 17px; flex-basis: 17px; }
}
@media (prefers-reduced-motion: reduce) { .piece.fresh { animation: none; } }
</style>
  <style>
.rush-board { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.rush-board .tile-row {
  max-width: 100%;
  min-height: 46px;

  border: 1px solid var(--line);

}
.rush-board .gap { min-width: 20px; flex-basis: 20px; }
.rush-incoming { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 5px; }
.rush-following { grid-column: 1 / -1; font-size: .83rem; }
.rush-incoming .piece { color: #25243a; min-width: 17px; min-height: 29px; padding-inline: 2px; font-size: .92rem; }
.rush-incoming .piece + .piece { margin-left: 0; }
@media (max-width: 370px) {
  .rush-board .gap { min-width: 17px; min-height: 36px; flex-basis: 17px; }
  .rush-board .tile-row { min-height: 38px; }
  .rush-board .piece { min-height: 34px; }
  .rush-puzzle .score { margin-block: 8px; }
  .rush-puzzle #message { margin-block: 6px; }
  .rush-puzzle .actions { gap: 4px; }
  .rush-puzzle .actions button { padding-inline: 5px; }
  .rush-board { gap: 4px 7px; }
}
.grid-actions { margin-bottom: 12px; }
.merge-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr) minmax(28px, .55fr)) minmax(0, 1fr);
  grid-template-rows: repeat(3, 41px 29px) 41px;
  max-width: 360px;
  padding: 8px;
  border-radius: 8px;
  background: #f9fafb;
  color: #25243a;
}
.merge-grid .piece {
  margin: 0;
  min-width: 0;
  min-height: 0;
}
.merge-grid[data-direction="down"] .piece.joined {
  writing-mode: vertical-rl;
  text-orientation: upright;
}
.merge-grid .gap {
  min-width: 0;
  min-height: 0;

  font-size: 1.3rem;
}
</style>
  </head>
<body data-mode="arcade">
  <header class="gamebar"><a href="index.html" aria-label="Back to AI Arcade">←</a><h1>Merge Grid</h1></header>
  <main>
    <section class="puzzle">
      <p>Read the grid across or down. Use two merges to leave as few tiles as you can.</p>
      <div class="actions grid-actions" role="group" aria-label="Reading direction">
        <button type="button" class="secondary" data-direction="across" aria-pressed="false">Across →</button>
        <button type="button" class="secondary" data-direction="down" aria-pressed="false">Down ↓</button>
      </div>
      <div class="score" aria-label="Personal bests">
        <span id="across-best"></span><span id="down-best"></span>
      </div>
      <div id="play" hidden>
        <div class="score" aria-label="Current attempt">
          <span id="tiles"></span><span id="moves"></span>
        </div>
      </div>
      <div id="grid" class="merge-grid" role="group" aria-label="Letter grid"></div>
      <p id="message" role="status"></p>
      <div class="actions">
        <button id="replay" type="button" class="secondary" disabled>Replay grid</button>
        <button id="next" type="button" class="secondary">New grid</button>
      </div>
    </section>

    <details class="explainer">
      <summary>The idea behind the game</summary>
      <p class="arcade-only">The direction decides which letters count as neighbors. A merge acts on adjacent pieces in that reading order, wherever the selected pair occurs.</p>
    </details>
  </main>
<script>
"use strict";

function matches(word, index, left, right) {
  return word[index] === left && word[index + 1] === right;
}

function merge(board, left, right) {
  return board.map(word => {
    const merged = [];
    for (let index = 0; index < word.length; index += 1) {
      if (matches(word, index, left, right)) {
        merged.push(left + right);
        index += 1;
      } else {
        merged.push(word[index]);
      }
    }
    return merged;
  });
}

function tileCount(words) {
  return words.reduce((total, word) => total + word.length, 0);
}

function drawMergeBoard(board, words, joined, onMerge) {
  board.replaceChildren(...words.map(word => {
    const row = document.createElement("div");
    row.className = "tile-row";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", word.join(""));
    word.forEach((piece, index) => {
      const tile = document.createElement("span");
      tile.className = "piece";
      tile.textContent = piece;
      if (piece.length > 1) tile.classList.add("joined");
      if (piece === joined) tile.classList.add("fresh");
      row.append(tile);
      if (index === word.length - 1 || !onMerge) return;
      const right = word[index + 1];
      const gap = document.createElement("button");
      gap.type = "button";
      gap.className = "gap";
      gap.textContent = "+";
      gap.setAttribute("aria-label", `Join ${piece} and ${right} in ${word.join("")}`);
      gap.addEventListener("click", () => onMerge(piece, right));
      row.append(gap);
    });
    return row;
  }));

}

const bestScores = new Map();

function readBest(key) {
  let saved = Infinity;
  try {
    const value = Number(localStorage.getItem(key));
    if (Number.isInteger(value) && value > 0) saved = value;
  } catch {
    // Keep session scores available when browser storage is blocked.
  }
  return Math.min(bestScores.get(key) ?? Infinity, saved);
}

function saveBest(key, tiles) {
  bestScores.set(key, tiles);
  try {
    localStorage.setItem(key, String(tiles));
  } catch {
    // The in-memory score already holds the record.
  }
}
</script>
<script>
"use strict";

if (new URLSearchParams(location.search).get("embed") === "1") {
  document.body.classList.add("embedded");
}

const grids = [
  ["chip", "rode", "open", "peas"],
  ["snap", "wore", "idea", "meat"],
  ["clam", "rare", "idea", "beat"]
];
const grid = document.querySelector("#grid");
const controls = [...document.querySelectorAll("button[data-direction]")];
const replay = document.querySelector("#replay");
const play = document.querySelector("#play");
const message = document.querySelector("#message");
let round = 0;
let direction = "";
let words = [];
let moves = 2;

function scoreKey(reading) {
  return `letter-merge.grid.${grids[round].join("-")}.${reading}`;
}

function renderScores() {
  for (const reading of ["across", "down"]) {
    const best = readBest(scoreKey(reading));
    const label = reading === "across" ? "Across best" : "Down best";
    document.querySelector(`#${reading}-best`).textContent = `${label} ${Number.isFinite(best) ? best : "—"}`;
  }
}

function renderRun(note = "", joined = "") {
  const count = tileCount(words);
  document.querySelector("#tiles").textContent = `${count} tiles`;
  document.querySelector("#moves").textContent = `${moves} ${moves === 1 ? "merge" : "merges"} left`;
  message.textContent = note;
  drawGrid(words, joined, moves ? (left, right) => {
    words = merge(words, left, right);
    moves -= 1;
    const remaining = tileCount(words);
    const best = moves === 0 && remaining < readBest(scoreKey(direction));
    if (best) saveBest(scoreKey(direction), remaining);
    renderScores();
    const saved = count - remaining;
    renderRun(`Saved ${saved} ${saved === 1 ? "tile" : "tiles"}.${best ? " Personal best." : ""}`, left + right);
    (grid.querySelector(".gap") || replay).focus();
  } : null);
}

function drawGrid(sequences, joined = "", onMerge = null) {
  const down = direction === "down";
  grid.replaceChildren();
  sequences.forEach((sequence, lane) => {
    const position = (element, offset, span = 1) => {
      const track = `${offset} / span ${span}`;
      const fixed = String(lane * 2 + 1);
      element.style.gridRow = down ? track : fixed;
      element.style.gridColumn = down ? fixed : track;
    };
    let offset = 1;
    sequence.forEach((piece, index) => {
      const tile = document.createElement("span");
      tile.className = "piece";
      tile.textContent = piece;
      tile.classList.toggle("joined", piece.length > 1);
      tile.classList.toggle("fresh", piece === joined);
      position(tile, offset, piece.length * 2 - 1);
      grid.append(tile);
      offset += piece.length * 2;
      if (!onMerge || index === sequence.length - 1) return;
      const right = sequence[index + 1];
      const gap = document.createElement("button");
      gap.type = "button";
      gap.className = "gap";
      gap.textContent = "+";
      gap.setAttribute("aria-label", `Join ${piece} and ${right} in ${sequence.join("")}`);
      position(gap, offset - 1);
      gap.addEventListener("click", () => onMerge(piece, right));
      grid.append(gap);
    });
  });
}

function choose(reading) {
  direction = reading;
  moves = 2;
  const rows = grids[round].map(word => [...word]);
  words = reading === "across" ? rows : rows[0].map((_, column) => rows.map(row => row[column]));
  grid.dataset.direction = reading;
  controls.forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.direction === reading));
  });
  play.hidden = false;
  replay.disabled = false;
  renderRun();
  grid.querySelector(".gap").focus();
}

function load() {
  direction = "";
  grid.dataset.direction = "";
  drawGrid(grids[round].map(word => [...word]));
  controls.forEach(button => button.setAttribute("aria-pressed", "false"));
  play.hidden = true;
  replay.disabled = true;
  message.textContent = "";
  renderScores();
}

for (const button of controls) {
  button.addEventListener("click", () => choose(button.dataset.direction));
}
replay.addEventListener("click", () => choose(direction));
document.querySelector("#next").addEventListener("click", () => {
  round = (round + 1) % grids.length;
  load();
  controls[0].focus();
});
load();
</script>
</body>
